name: Publish

# Publishes to npm with provenance when a GitHub release is published.
# Uses npm trusted publishing (OIDC): no token in the repo. Set it up once on
# npmjs.com under the package's Settings > Trusted publishing, pointing at
# this repository and this workflow file.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
